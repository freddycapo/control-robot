[platformio]
src_dir = .
include_dir = .

[env:dev]
platform = ststm32
platform_packages = toolchain-gccarmnoneeabi@=1.140201.0
monitor_speed = 115200
upload_protocol = dfu

board = blackpill_f401cc
board_build.ldscript = STM32F401xx_FLASH.ld

build_src_filter = 
    +<Core/Src/>
    +<Drivers/STM32F4xx_HAL_Driver/Src/>
    -<Drivers/STM32F4xx_HAL_Driver/Src/*_template.c>
    +<*.s>
    +<Core/Src/pasqualo-firmware>
    +<USB_DEVICE/>
    +<Middlewares/ST/STM32_USB_Device_Library/Core/Src/>
    -<Middlewares/ST/STM32_USB_Device_Library/Core/Src/*_template.c>
    +<Middlewares/ST/STM32_USB_Device_Library/Class/CDC/Src/>

build_flags = 
    -DUSE_HAL_DRIVER
    -std=gnu23
    -DSTM32F401xC
    -ICore/Inc
    -ICore/Inc/pasqualo-firmware
    -IUSB_DEVICE/App
    -IUSB_DEVICE/Target
    -IMiddlewares/ST/STM32_USB_Device_Library/Core/Inc
    -IMiddlewares/ST/STM32_USB_Device_Library/Class/CDC/Inc
    -IDrivers/STM32F4xx_HAL_Driver/Inc
    -IDrivers/STM32F4xx_HAL_Driver/Inc/Legacy
    -IDrivers/CMSIS/Include
    -IDrivers/CMSIS/Device/ST/STM32F4xx/Include

lib_deps = https://github.com/freddycapo/uart-lib


